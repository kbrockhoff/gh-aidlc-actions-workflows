# Opens and updates a release PR from conventional commits on main. Merging it
# tags vX.Y.Z and publishes a GitHub release; the floating vMAJOR tag that callers
# pin shared workflows to is then moved to the latest release. RELEASE_PLEASE_TOKEN is used instead of
# GITHUB_TOKEN so the release PR triggers CI and the tags are pushed by a real
# identity.
name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Reconciles vMAJOR with the latest release on every run instead of only when this
  # run created a release, so a run that failed after publishing is repaired by the next.
  floating-tag:
    name: Move floating major tag
    needs: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Point vMAJOR at the latest release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          release=$(gh release view --repo "${REPO}" --json tagName --jq .tagName 2>/dev/null || true)
          if [[ ! "${release}" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "No published vX.Y.Z release yet; nothing to do"
            exit 0
          fi
          tag="v${BASH_REMATCH[1]}"
          sha=$(gh api "repos/${REPO}/commits/${release}" --jq .sha)
          current=$(gh api "repos/${REPO}/commits/${tag}" --jq .sha 2>/dev/null || true)
          if [[ "${current}" == "${sha}" ]]; then
            echo "${tag} already points at ${release} (${sha})"
          elif [[ -n "${current}" ]]; then
            gh api -X PATCH "repos/${REPO}/git/refs/tags/${tag}" -f sha="${sha}" -F force=true --silent
            echo "Moved ${tag} to ${release} (${sha})" >> "${GITHUB_STEP_SUMMARY}"
          else
            gh api -X POST "repos/${REPO}/git/refs" -f ref="refs/tags/${tag}" -f sha="${sha}" --silent
            echo "Created ${tag} at ${release} (${sha})" >> "${GITHUB_STEP_SUMMARY}"
          fi

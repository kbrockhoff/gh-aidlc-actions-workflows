[project]
name = "beads-elt"
version = "0.1.1"
description = "Extract a beads Dolt database and load it into S3 Tables Iceberg tables"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40",
    "pyiceberg[pyarrow,pyiceberg-core]==0.12.0",
]

[project.scripts]
beads-elt = "beads_elt.cli:main"

[dependency-groups]
dev = [
    "pyiceberg[sql-sqlite]==0.12.0",
    "pytest>=9.0",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
